# ----------------------------------------------------------------------
# Default catch-all & Gateway Health Check
# ----------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    location /health {
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    location / {
        default_type application/json;
        return 200 '{"status": "ok", "service": "Nginx Gateway", "message": "Marketplace Local Reverse Proxy is running."}';
    }
}
