# ----------------------------------------------------------------------
# Storefront (marketplace.local) -> Next.js Storefront
# ----------------------------------------------------------------------
server {
    listen 80;
    server_name marketplace.local;

    location / {
        set $storefront_upstream http://storefront:3000;
        proxy_pass $storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback;
    }

    location @fallback {
        default_type application/json;
        return 503 '{"status": 503, "domain": "marketplace.local", "target": "Storefront", "message": "Storefront application is starting or not connected."}';
    }
}
