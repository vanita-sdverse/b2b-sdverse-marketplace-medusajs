# ----------------------------------------------------------------------
# Medusa Backend API (api.marketplace.local)
# ----------------------------------------------------------------------
server {
    listen 80;
    server_name api.marketplace.local;

    location / {
        set $api_upstream http://medusa:9000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback;
    }

    location @fallback {
        default_type application/json;
        return 503 '{"status": 503, "domain": "api.marketplace.local", "target": "Medusa Backend", "message": "Medusa Backend API service is starting or not connected."}';
    }
}
